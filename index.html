<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Quién Quiere Ser Millonario? - Rematricula USAM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-container">
    <header>
      <h1>¿Quién Quiere Ser Millonario?</h1>
      <h2>Edición Expertos en Rematricula USAM</h2>
    </header>

    <main class="main-content">
      <!-- Panel de la Pregunta y Respuestas -->
      <section class="quiz-box">
        <div id="question-container" class="question-container">
          <p id="question-text">Cargando pregunta...</p>
        </div>

        <div id="answer-buttons" class="answers-grid">
          <button class="btn" onclick="selectAnswer(0)">A: <span id="opt0"></span></button>
          <button class="btn" onclick="selectAnswer(1)">B: <span id="opt1"></span></button>
          <button class="btn" onclick="selectAnswer(2)">C: <span id="opt2"></span></button>
          <button class="btn" onclick="selectAnswer(3)">D: <span id="opt3"></span></button>
        </div>

        <div class="lifelines">
          <button id="btn-5050" onclick="useLifeline('5050')">💡 50:50</button>
          <button id="btn-expert" onclick="useLifeline('expert')">📞 Llamada Experto</button>
          <button id="btn-audience" onclick="useLifeline('audience')">👥 Publico</button>
        </div>
      </section>

      <!-- Pirámide de Premios -->
      <aside class="ladder-box">
        <h3>Escala de Premios</h3>
        <ul id="ladder-list">
          <!-- Se genera dinámicamente -->
        </ul>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
